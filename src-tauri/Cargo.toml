[package]
name = "olko-desktop"
version = "0.4.1"
description = "Olko ERP Desktop Client"
authors = ["Rasim <midiya.agency@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# ✅ 2026-07-27: avtomatik yeniləmə — imzalı paket yoxlanışı (pubkey tauri.conf.json-dadır)
# Yalnız masaüstü: mobil platformalarda updater dəstəklənmir.

# ✅ 2026-07-21: Native LAN çap körpüsü (olko-pos ilə eyni)
base64 = "0.22"
tiny_http = "0.12"

# ✅ 2026-07-17: `open` crate-i Android-də yoxdur — yalnız desktop target-lərdə
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
