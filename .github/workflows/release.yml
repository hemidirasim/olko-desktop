name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: mac-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ⚠️ 2026-07-27: BU ADDIM YALNIZ BİR DƏFƏ OLMALIDIR.
      # Əvvəl fayl səhvən dublikatlanmışdı: bir "Build Tauri" APPLE_* env-i ilə amma
      # tagName/args OLMADAN işləyirdi (imzalayır, notarizasiya edir, sonra
      # "skipping all uploads"), digəri isə tagName/args ilə amma APPLE_* OLMADAN
      # (imzasız yığır və MƏHZ ONU relizə yükləyir). Nəticə: jurnalda "Notarizing…
      # Accepted" görünürdü, amma yüklənən DMG ad-hoc imzalı çıxırdı.
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Avtomatik yeniləmə imzası — bunlar olmadan `latest.json` və `.sig`
          # artefaktları yaradılmır, updater işləməz.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS kod imzası — "Developer ID Application: Midiya Agency, MMC (CAD4QCJH2Q)"
          # ⚠️ QAYDA: bu dəyişənlər YALNIZ secret-lər REAL dəyərlə doldurulanda saxlanmalıdır.
          # Boş secret → GitHub env-i boş sətir kimi verir → tauri-action `security import`
          # çağırır → "failed to import keychain certificate" (v0.4.0-da baş verdi).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarizasiya (Apple serverində təsdiq) — app-specific password ilə.
          # APPLE_ID hesabın GİRİŞ e-poçtudur (support@midiya.az), gmail deyil.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Olko ERP ${{ github.ref_name }}'
          releaseBody: 'Olko ERP Desktop yeni versiya'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
