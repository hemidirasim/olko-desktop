name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: mac-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ✅ 2026-07-27: avtomatik yeniləmə imzası. Bu dəyişənlər olmadan
          # `latest.json` və imzalı artefaktlar YARADILMIR → updater işləməz.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ⚠️ 2026-07-27: macOS imza dəyişənləri MÜVƏQQƏTİ ÇIXARILDI.
          # Səbəb (v0.4.0 relizində təsdiq olundu): APPLE_* secret-ləri mövcud olmasa da
          # GitHub onları BOŞ SƏTİR kimi təyin edir; tauri-action isə dəyişən "var" sayıb
          # `security import` çağırır → "failed to import keychain certificate" ilə hər iki
          # Mac build-i partlayır (Windows normal keçir). Əvvəlki 2026-07-21 kommiti bu bloku
          # əlavə etmişdi, amma o vaxtdan reliz yığılmamışdı — ona görə indi üzə çıxdı.
          #
          # APPLE DEVELOPER SERTİFİKATI ALINANDA: aşağıdakı sətirləri geri qaytar VƏ
          # eyni adlı secret-ləri repoya əlavə et (boş secret ilə işə salma — yenə partlayar).
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # Hazırda Mac build-i İMZASIZDIR — ilk açılışda Gatekeeper xəbərdarlığı verir
          # (sağ klik → "Aç" ilə keçilir). v0.3.0 da imzasız idi, davranış dəyişmir.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Olko ERP ${{ github.ref_name }}'
          releaseBody: 'Olko ERP Desktop yeni versiya'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
